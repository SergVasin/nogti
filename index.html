<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Мастера</title>
	<link rel="shortcut icon" href="">
	<link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@300;700&display=swap" rel="stylesheet">
	<link href="css/normalize.css" rel="stylesheet" type="text/css"/>
	<link href="css/style.css" rel="stylesheet" type="text/css"/>
	<link href="css/responsive.css" rel="stylesheet" type="text/css"/>
</head>
<body>
	<header class="header">
		<div class="container">
			<div class="header__wr">
				<a href="#" class="logo">
					<img src="img/logo.svg" alt="">
				</a>
				<div class="location">
					<img src="img/location.svg" alt="">
					<p class="location__city">Москва</p>
					<div class="location__block"></div>
				</div>
				<div class="phone">
					<img src="img/phone.svg" alt="">
					<a href="tel:+74957773333" class="phone__link"><span>+7 (495)</span> 777-33-33</a>
				</div>
				<a href="#" class="forum-link">Форум</a>
				<div class="enter">
					<img src="img/person.svg" alt="">
					<a href="#" class="enter-link">Вход в личный кабинет</a>
				</div>
			</div>
		</div>
	</header>
	<section class="main">
		<img class="main__bg" src="img/main-bg.png" alt="">
		<img class="main-img main1" src="img/main1.svg" alt="">
		<img class="main-img main2" src="img/main2.svg" alt="">
		<img class="main-img main3" src="img/main3.svg" alt="">
		<div class="container">
			<div class="main__tab">
				<img src="img/main-tab1.svg" alt="" class="main__tab-img main__tab-img1">
				<img src="img/main-tab2.svg" alt="" class="main__tab-img main__tab-img2">
				<p class="main__tab-text main__tab-text1">Вы</p>
				<a href="#tab1" class="main__tab-link">клиент</a>
				<p class="main__tab-text">или</p>
				<a href="#tab2" class="main__tab-link">мастер</a>
			</div>
		</div>
		<div class="container">
			<img class="main-img main4" src="img/main4.svg" alt="">
			<img class="main-img main5" src="img/main5.svg" alt="">
			<div id="tab1" class="main__wr">
				<h1 class="main__title">ваш помощник в поиске мастеров красоты</h1>
				<div class="search">
					<div class="search__box">
						<input class="search__box-input"type="text" placeholder="Введите желаемую услугу">
						<div class="search__box-categoty">
							<p class="box-categoty__item box-categoty__item1">Уход за лицом</p>
							<p class="box-categoty__item box-categoty__item2">Коррекция</p>
							<p class="box-categoty__item box-categoty__item3">Уход за лицом</p>
						</div>
					</div>
					<button class="search__btn">
						<img src="img/main-btn.svg" alt="">
					</button>
				</div>
			</div>
			<div id="tab2" class="main__wr">
				<h1 class="main__title">ваш помощник в поиске клиентов</h1>
				<div class="search">
					<div class="search__box">
						<input class="search__box-input"type="text" placeholder="Введите желаемую услугу">
						<div class="search__box-categoty">
							<p class="box-categoty__item box-categoty__item1">Уход за лицом</p>
							<p class="box-categoty__item box-categoty__item2">Коррекция</p>
							<p class="box-categoty__item box-categoty__item3">Уход за лицом</p>
						</div>
					</div>
					<button class="search__btn">
						<img src="img/main-btn.svg" alt="">
					</button>
				</div>
			</div>
		</div>
	</section>




	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
	<script src="script.js"></script>
</body>
</html>
